name: Crux
description: >-
  Crux is a capital platform for the clean economy, connecting clean energy and
  manufacturing developers with buyers, lenders, and investors. Its marketplace
  facilitates the sale of transferable clean energy tax credits created under the
  Inflation Reduction Act, alongside debt capital markets, tax equity, and preferred
  equity solutions and advisory services. Crux pairs a transaction platform and secure
  data room with market intelligence drawn from tens of billions of dollars in deal data,
  serving project developers, manufacturers, tax credit buyers, banks, tax advisors, and
  legal teams. The company is backed by Andreessen Horowitz (a16z) and was added to the
  API Evangelist network as a portfolio lead. Crux operates a customer application but
  does not publish a public developer API or OpenAPI at this time.
